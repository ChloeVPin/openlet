<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Openlet Study Architecture &amp; System Flow</title>
  <desc id="arch-desc">Four-stage system flow: Card Creation, FSRS Scheduling, Active Study Modes, and Supabase Sync.</desc>

  <!-- Background Canvas (Flat Light Mode, No Gradients) -->
  <rect width="1200" height="200" rx="16" fill="#FAFAFA"/>
  <rect width="1200" height="200" rx="16" fill="none" stroke="#EDEFF4" stroke-width="1.5"/>

  <!-- Step 1: Card Creation -->
  <g transform="translate(30, 32)">
    <rect width="245" height="136" rx="12" fill="#FFFFFF" stroke="#EDEFF4" stroke-width="1.5"/>
    <rect x="14" y="14" width="30" height="30" rx="6" fill="#4255FF" fill-opacity="0.12" stroke="#4255FF" stroke-width="1"/>
    <text x="29" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#4255FF" text-anchor="middle">1</text>

    <text x="54" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#303545">CARD CREATION</text>
    <text x="14" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#646F90">Manual input, AI generator,</text>
    <text x="14" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#646F90">image occlusion &amp; CSV import</text>
    <text x="14" y="112" font-family="ui-monospace, monospace" font-size="12" fill="#4255FF">deck ingestion</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <g transform="translate(285, 86)">
    <path d="M 0 15 L 18 15 M 13 9 L 19 15 L 13 21" fill="none" stroke="#4255FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Step 2: FSRS Scheduling -->
  <g transform="translate(315, 32)">
    <rect width="245" height="136" rx="12" fill="#FFFFFF" stroke="#EDEFF4" stroke-width="1.5"/>
    <rect x="14" y="14" width="30" height="30" rx="6" fill="#4255FF" fill-opacity="0.12" stroke="#4255FF" stroke-width="1"/>
    <text x="29" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#4255FF" text-anchor="middle">2</text>

    <text x="54" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#303545">FSRS SCHEDULER</text>
    <text x="14" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#646F90">Algorithm calculates stability</text>
    <text x="14" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#646F90">and memory recall intervals</text>
    <text x="14" y="112" font-family="ui-monospace, monospace" font-size="12" fill="#4255FF">fsrs.ts engine</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <g transform="translate(570, 86)">
    <path d="M 0 15 L 18 15 M 13 9 L 19 15 L 13 21" fill="none" stroke="#4255FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Step 3: Study Modes -->
  <g transform="translate(600, 32)">
    <rect width="265" height="136" rx="12" fill="#FFFFFF" stroke="#EDEFF4" stroke-width="1.5"/>
    <rect x="14" y="14" width="30" height="30" rx="6" fill="#4255FF" fill-opacity="0.12" stroke="#4255FF" stroke-width="1"/>
    <text x="29" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#4255FF" text-anchor="middle">3</text>

    <text x="54" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#303545">STUDY MODES</text>
    <text x="14" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#646F90">Engage in Flashcards, Learn,</text>
    <text x="14" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#646F90">Write, Match &amp; Test sessions</text>
    <text x="14" y="112" font-family="ui-monospace, monospace" font-size="12" fill="#4255FF">active learning</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <g transform="translate(875, 86)">
    <path d="M 0 15 L 18 15 M 13 9 L 19 15 L 13 21" fill="none" stroke="#4255FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Step 4: Supabase Sync -->
  <g transform="translate(905, 32)">
    <rect width="265" height="136" rx="12" fill="#FFFFFF" stroke="#EDEFF4" stroke-width="1.5"/>
    <rect x="14" y="14" width="30" height="30" rx="6" fill="#4255FF" stroke="#4255FF" stroke-width="1"/>
    <text x="29" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>

    <text x="54" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#303545">SUPABASE SYNC</text>
    <text x="14" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#646F90">Persists study state via Postgres,</text>
    <text x="14" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#646F90">Drizzle ORM &amp; RLS security</text>
    <text x="14" y="112" font-family="ui-monospace, monospace" font-size="12" fill="#4255FF">realtime persistence</text>
  </g>
</svg>
